,"category":"行业","term":"Building","arabic":"مبنى","transliteration":"mabnā","chinese_sound":"马布纳","meaning":"建筑、楼宇。","synonyms":["建筑","楼宇"],"aliases":["Building","مبنى","马布纳","mabnā","建筑","楼宇","房建"],"audio":"assets/audio/building.mp3","duration":0.668,"note":""},{"id":"cement","index":371,"category":"行业","term":"Cement","arabic":"إسمنت","transliteration":"ismant","chinese_sound":"伊斯曼特","meaning":"水泥。","synonyms":["水泥"],"aliases":["Cement","إسمنت","伊斯曼特","ismant","水泥"],"audio":"assets/audio/cement.mp3","duration":0.779,"note":""},{"id":"concrete","index":372,"category":"行业","term":"Concrete","arabic":"خرسانة","transliteration":"kharasāna","chinese_sound":"哈拉萨纳","meaning":"混凝土。","synonyms":["混凝土"],"aliases":["Concrete","خرسانة","哈拉萨纳","kharasāna","混凝土"],"audio":"assets/audio/concrete.mp3","duration":0.928,"note":""},{"id":"glass","index":373,"category":"行业","term":"Glass","arabic":"زجاج","transliteration":"zujāj","chinese_sound":"祖贾杰","meaning":"玻璃。","synonyms":["玻璃"],"aliases":["Glass","زجاج","祖贾杰","zujāj","玻璃"],"audio":"assets/audio/glass.mp3","duration":0.791,"note":""},{"id":"hospital","index":374,"category":"行业","term":"Hospital","arabic":"مستشفى","transliteration":"mustashfā","chinese_sound":"穆斯塔什法","meaning":"医院。","synonyms":["医院"],"aliases":["Hospital","مستشفى","穆斯塔什法","mustashfā","医院"],"audio":"assets/audio/hospital.mp3","duration":0.982,"note":""},{"id":"clinic","index":375,"category":"行业","term":"Clinic","arabic":"عيادة","transliteration":"ʿiyāda","chinese_sound":"伊亚达","meaning":"诊所。","synonyms":["诊所"],"aliases":["Clinic","عيادة","伊亚达","ʿiyāda","诊所"],"audio":"assets/audio/clinic.mp3","duration":0.743,"note":""},{"id":"pharmacy","index":376,"category":"行业","term":"Pharmacy","arabic":"صيدلية","transliteration":"ṣaydaliyya","chinese_sound":"赛达利亚","meaning":"药房、药店。","synonyms":["药房","药店"],"aliases":["Pharmacy","صيدلية","赛达利亚","ṣaydaliyya","药房","药店"],"audio":"assets/audio/pharmacy.mp3","duration":1.052,"note":""},{"id":"textile","index":377,"category":"行业","term":"Textile","arabic":"نسيج","transliteration":"nasīj","chinese_sound":"纳西杰","meaning":"纺织品。","synonyms":["纺织品"],"aliases":["Textile","نسيج","纳西杰","nasīj","纺织品","منسوجات","纺织"],"audio":"assets/audio/textile.mp3","duration":0.73,"note":""},{"id":"cotton","index":378,"category":"行业","term":"Cotton","arabic":"قطن","transliteration":"quṭn","chinese_sound":"库特恩","meaning":"棉花。","synonyms":["棉花"],"aliases":["Cotton","قطن","库特恩","quṭn","棉花"],"audio":"assets/audio/cotton.mp3","duration":0.538,"note":""},{"id":"toys","index":379,"category":"行业","term":"Toys","arabic":"ألعاب","transliteration":"alʿāb","chinese_sound":"阿尔阿布","meaning":"玩具。","synonyms":["玩具"],"aliases":["Toys","ألعاب","阿尔阿布","alʿāb","玩具"],"audio":"assets/audio/toys.mp3","duration":0.734,"note":""}];
const list = document.getElementById('list');
const qBox = document.getElementById('q');
const chips = document.getElementById('chips');
const status = document.getElementById('status');
const empty = document.getElementById('empty');
const reviewInfo = document.getElementById('review');
const seqBtn = document.getElementById('seq');
const clearBtn = document.getElementById('clear');
const panel = document.querySelector('.panel');
const batchBox = document.getElementById('batchBox');
const batchTitle = document.getElementById('batchTitle');

const player = new Audio();
let current = null;          // 当前播放的条目
let seq = false;             // 连播开关
let audible = null;          // 已播放过的 audio_id，用于“重听”显示
let batchMode = false;
let batchIds = [];
let batchSet = new Set();

// ---- 听审标记（localStorage，失败不影响播放） ----
const STORE = 'gulfgate-arabic-review-v2';
let reviewed = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || '{"ids":[]}');
  reviewed = new Set(saved.ids || []);
} catch (e) { reviewed = new Set(); }
function saveReview() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ ids: [...reviewed], saved_at: new Date().toISOString() }));
  } catch (e) {}
  renderReview();
}
function renderReview() {
  reviewInfo.textContent = `已听 ${reviewed.size} / ${DATA.length}`;
}

// ---- 渲染 ----
const cats = [...new Set(DATA.map(t => t.category))];
chips.innerHTML = '';
const allChip = document.createElement('button');
allChip.className = 'chip';
allChip.textContent = '全部';
allChip.setAttribute('aria-pressed', 'true');
allChip.dataset.cat = '';
chips.appendChild(allChip);
for (const c of cats) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = c;
  b.setAttribute('aria-pressed', 'false');
  b.dataset.cat = c;
  chips.appendChild(b);
}
let activeCat = '';

const nodes = {};
for (const t of DATA) {
  const el = document.createElement('article');
  el.id = t.id;
  const top = document.createElement('div');
  top.className = 'top';
  const left = document.createElement('div');
  const ar = document.createElement('div');
  ar.className = 'ar';
  ar.lang = 'ar';
  ar.dir = 'rtl';
  ar.textContent = t.arabic;
  const line = document.createElement('p');
  line.className = 'line';
  line.textContent = `${t.transliteration} ｜ ${t.chinese_sound} ｜ ${t.term}`;
  const mean = document.createElement('p');
  mean.className = 'meaning';
  mean.textContent = t.meaning;
  left.append(ar, line, mean);
  if (t.note) {
    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = t.note;
    left.appendChild(note);
  }
  const right = document.createElement('div');
  right.className = 'player';
  const btn = document.createElement('button');
  btn.className = 'play';
  btn.type = 'button';
  btn.textContent = '▶ 听发音';
  btn.setAttribute('aria-label', `听发音 ${t.term}`);
  const bar = document.createElement('div');
  bar.className = 'bar';
  const fill = document.createElement('i');
  bar.appendChild(fill);
  const dur = document.createElement('div');
  dur.className = 'line';
  dur.style.textAlign = 'right';
  dur.textContent = `${t.duration ? t.duration.toFixed(1) : '?'} 秒`;
  right.append(btn, bar, dur);
  top.append(left, right);

  const row2 = document.createElement('div');
  row2.className = 'row2';
  const tag = document.createElement('span');
  tag.className = 'cat';
  tag.textContent = t.category;
  const mark = document.createElement('button');
  mark.className = 'mark';
  mark.type = 'button';
  mark.dataset.id = t.id;
  mark.setAttribute('aria-pressed', reviewed.has(t.id) ? 'true' : 'false');
  mark.textContent = reviewed.has(t.id) ? '✓ 已听' : '标记已听';
  const leftMeta = document.createElement('div');
  leftMeta.append(tag);
  row2.append(leftMeta, mark);
  el.append(top, row2);
  el.dataset.search = [t.arabic, t.term, t.transliteration, t.chinese_sound, t.meaning,
                       t.category, (t.synonyms || []).join(' '), (t.aliases || []).join(' ')]
                      .join(' ').toLowerCase();
  el.dataset.cat = t.category;

  btn.addEventListener('click', () => toggle(t, el, btn, fill));
  mark.addEventListener('click', () => {
    if (reviewed.has(t.id)) reviewed.delete(t.id); else reviewed.add(t.id);
    mark.setAttribute('aria-pressed', reviewed.has(t.id) ? 'true' : 'false');
    mark.textContent = reviewed.has(t.id) ? '✓ 已听' : '标记已听';
    saveReview();
  });
  nodes[t.id] = { el, btn, fill, data: t };
  list.appendChild(el);
}
renderReview();
document.getElementById('meta').textContent =
  `${DATA.length} 条高频词条 · ${cats.length} 个分类 · ${new Set(DATA.map(t => t.audio)).size} 段离线音频`;

function visible() {
  const source = batchMode ? batchIds.map(id => nodes[id]?.data).filter(Boolean) : DATA;
  return source.filter(t => {
    const n = nodes[t.id];
    return !n.el.hidden;
  });
}
function toggle(t, el, btn, fill) {
  const n = nodes[t.id];
  if (current === t && !player.paused) {
    player.pause();
    btn.textContent = '▶ 继续';
    status.textContent = `已暂停：${t.arabic}`;
    return;
  }
  playNode(t);
}
function playNode(t) {
  const n = nodes[t.id];
  current = t;
  if (player.src.indexOf(encodeURI(t.audio)) === -1) player.src = t.audio;
  player.currentTime = 0;
  const p = player.play();
  if (p && p.catch) p.catch(() => { status.textContent = '浏览器拦截了自动播放，请直接点击“▶ 听发音”。'; });
}
player.addEventListener('timeupdate', () => {
  if (!current) return;
  const n = nodes[current.id];
  const d = player.duration || current.duration || 1;
  n.fill.style.width = Math.min(100, (player.currentTime / d) * 100) + '%';
});
player.addEventListener('play', () => {
  if (!current) return;
  nodes[current.id].btn.textContent = '❚❚ 暂停';
  status.textContent = `正在播放：${current.arabic}`;
});
player.addEventListener('ended', () => {
  if (!current) return;
  const n = nodes[current.id];
  n.btn.textContent = '↻ 重听';
  n.fill.style.width = '100%';
  status.textContent = `播放结束：${current.arabic}（可点击重听）`;
  if (seq) {
    const vis = visible();
    const i = vis.findIndex(x => x.id === current.id);
    const next = vis[i + 1];
    if (next) {
      nodes[next.id].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      setTimeout(() => playNode(next), 260);
    } else {
      seq = false;
      seqBtn.setAttribute('aria-pressed', 'false');
      seqBtn.textContent = '连播：关';
      status.textContent = '连播结束。';
    }
  }
});
player.addEventListener('error', () => {
  status.textContent = '音频加载失败：请确认 assets/audio 目录与 player.html 保持相对位置。';
});

// ---- 筛选 ----
function apply() {
  const q = qBox.value.toLowerCase().trim();
  let n = 0;
  for (const t of DATA) {
    const node = nodes[t.id];
    const okBatch = !batchMode || batchSet.has(t.id);
    const okCat = !activeCat || t.category === activeCat;
    const okQ = !q || node.el.dataset.search.includes(q);
    const show = okBatch && okCat && okQ;
    node.el.hidden = !show;
    node.el.classList.remove('hit');
    if (show) n++;
  }
  empty.hidden = n !== 0;
  if (q || activeCat) status.textContent = `筛选出 ${n} 条。`;
}
qBox.addEventListener('input', apply);
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  activeCat = b.dataset.cat;
  for (const c of chips.children) c.setAttribute('aria-pressed', c === b ? 'true' : 'false');
  apply();
});

// ---- 连播 / 重听 / 导出 ----
seqBtn.addEventListener('click', () => {
  seq = !seq;
  seqBtn.setAttribute('aria-pressed', seq ? 'true' : 'false');
  seqBtn.textContent = seq ? '连播：开' : '连播：关';
  if (seq) {
    const vis = visible();
    if (vis.length) { playNode(vis[0]); }
    else status.textContent = '当前筛选结果为空，无法连播。';
  }
});
clearBtn.addEventListener('click', () => {
  qBox.value = '';
  activeCat = '';
  for (const c of chips.children) c.setAttribute('aria-pressed', c.dataset.cat === '' ? 'true' : 'false');
  apply();
  status.textContent = '已恢复显示全部词条。';
});
document.getElementById('export').addEventListener('click', () => {
  const payload = {
    exported_at: new Date().toISOString(),
    total: DATA.length,
    reviewed: [...reviewed],
    reviewed_count: reviewed.size,
    unreviewed: DATA.filter(t => !reviewed.has(t.id)).map(t => t.id)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '听审结果.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

// ---- 本轮词汇：一个链接携带多个词条，只显示本轮清单 ----
function showBatch(ids) {
  const seen = new Set();
  const valid = [];
  for (const id of ids) {
    if (nodes[id] && !seen.has(id)) { seen.add(id); valid.push(id); }
  }
  if (!valid.length) return false;
  batchMode = true;
  batchIds = valid;
  batchSet = new Set(valid);
  qBox.value = '';
  activeCat = '';
  for (const c of chips.children) c.setAttribute('aria-pressed', c.dataset.cat === '' ? 'true' : 'false');
  for (const id of valid) list.appendChild(nodes[id].el);
  for (const t of DATA) if (!batchSet.has(t.id)) list.appendChild(nodes[t.id].el);
  apply();
  panel.classList.add('batch-active');
  batchBox.hidden = false;
  batchTitle.textContent = `本轮词汇 · ${valid.length} 个`;
  seq = false;
  seqBtn.setAttribute('aria-pressed', 'false');
  seqBtn.textContent = '连播：关';
  seqBtn.hidden = true;
  clearBtn.hidden = true;
  status.textContent = `已载入本轮 ${valid.length} 个词。请按需选择词条右侧“▶ 听发音”。`;
  return true;
}
document.getElementById('batchAll').addEventListener('click', () => {
  player.pause();
  seq = false;
  seqBtn.setAttribute('aria-pressed', 'false');
  seqBtn.textContent = '连播：关';
  batchMode = false;
  batchIds = [];
  batchSet = new Set();
  panel.classList.remove('batch-active');
  seqBtn.hidden = false;
  clearBtn.hidden = false;
  for (const t of DATA) list.appendChild(nodes[t.id].el);
  batchBox.hidden = true;
  qBox.value = '';
  activeCat = '';
  for (const c of chips.children) c.setAttribute('aria-pressed', c.dataset.cat === '' ? 'true' : 'false');
  history.replaceState(null, '', location.pathname);
  apply();
  status.textContent = '已显示完整词库。';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ---- 深链：?play=id 或 #id 直接定位词条 ----
function focusTerm(id, shouldPlay = true) {
  if (!id) return false;
  const node = nodes[id];
  if (!node) return false;
  qBox.value = '';
  activeCat = '';
  for (const c of chips.children) c.setAttribute('aria-pressed', c.dataset.cat === '' ? 'true' : 'false');
  apply();
  node.el.classList.add('hit');
  node.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  status.textContent = `已定位：${node.data.arabic}｜${node.data.chinese_sound}，正在尝试播放。`;
  if (shouldPlay) playNode(node.data);
  return true;
}
function focusDeepLink() {
  const params = new URLSearchParams(location.search);
  const termIds = (params.get('terms') || '').split(',').map(x => x.trim()).filter(Boolean);
  if (termIds.length && showBatch(termIds)) return;
  const playId = params.get('play');
  const hashId = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if (focusTerm(playId || hashId, true)) return;
  if (params.get('q')) { qBox.value = params.get('q'); apply(); }
}
window.addEventListener('hashchange', focusDeepLink);
focusDeepLink();
</script>
